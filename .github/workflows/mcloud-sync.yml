name: mcloud sync

# Once a day: what mcloud merged, closed or wrote into STATUS.md since the
# inbox's mark goes into MCLOUD-GOREVLER.md's inbox, committed to main. Only
# that file is committed, and the script rewrites only the lines between the
# inbox's marks. Actions may not open pull requests in this repository (the
# owner's setting), hence the commit. No force push: when main moved meanwhile,
# the commit is rebased onto it and pushed again. GitHub turns schedules off
# after 60 days without activity in the repository; run it by hand to turn
# them back on.

on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mcloud-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Collect what is new in mcloud
        id: sync
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/mcloud-sync.py

      - name: Commit to main
        if: steps.sync.outputs.added != '0'
        run: |
          git add MCLOUD-GOREVLER.md
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "Inbox: what is new in mcloud"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
          done
          exit 1
